<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NOVA · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css?v=24"><link rel="stylesheet" href="css/app.css?v=24"><style>html{background:#050507;color:#fff}</style></head><body>
<main class="reg"><h1 class="title">NOVA <em>GLOBAL</em></h1><section class="login-card rgb"><h2 id="account-title">Entrar como invitado</h2><p class="muted" id="account-hint">Crea o usa tu cuenta con usuario, contraseña y ubicación.</p><p class="demo" id="demo" hidden></p>
<form class="form" id="account-form" novalidate><div class="access-tabs"><button class="access-tab active" id="guest-mode" type="button">Invitado</button><button class="access-tab" id="staff-mode" type="button">Staff</button></div><input type="hidden" id="mode" value="guest"><label for="user">Nombre de usuario</label><input class="in" id="user" maxlength="16" placeholder="ej. luna_77" autocomplete="username" required><div id="password-box"><label for="password">Contraseña</label><input class="in" id="password" type="password" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="current-password" required></div><label class="check"><input type="checkbox" id="remember" checked> Recordar mi acceso</label><div id="picker"><label>Tu ubicación <span class="hint">(para tu pin en el mapa)</span></label></div><button class="btn main" id="go" type="submit">Entrar como invitado</button><p class="err" id="err" role="alert"></p></form></section><p class="hint login-note">Invitado entra al chat. Staff usa el mismo usuario y contraseña para administrar si tiene un rol asignado.</p></main>
<script src="js/config.js?v=24"></script><script src="js/auth.js?v=24"></script><script src="js/store.js?v=24"></script><script src="js/geo.js?v=24"></script><script src="js/roles.js?v=24"></script><script src="js/touch.js?v=24"></script><script src="js/register.js?v=24"></script></body></html>
