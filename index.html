<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NOVA · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css?v=11"><link rel="stylesheet" href="css/app.css?v=11"><style>html{background:#050507;color:#fff}</style></head><body>
<main class="reg"><h1 class="title">NOVA <em>GLOBAL</em></h1><h2 id="account-title" style="margin:0">Crea tu cuenta</h2><p class="muted" id="account-hint" style="margin:0">Regístrate una vez y tu acceso seguirá funcionando aunque publiques nuevas versiones.</p>
<p class="demo" id="demo" hidden></p><form class="form rgb" id="account-form" novalidate><input type="hidden" id="mode" value="register"><label for="user">Nombre de usuario</label><input class="in" id="user" maxlength="16" placeholder="ej. AX_CO" autocomplete="username" required><label for="password">Contraseña</label><input class="in" id="password" type="password" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required><input class="in" id="password2" type="password" minlength="6" placeholder="Repite la contraseña" autocomplete="new-password" required><label class="check"><input type="checkbox" id="remember" checked> Recordar mi inicio de sesión</label><div id="picker"><label>Tu ubicación <span class="hint">(para tu pin en el mapa)</span></label></div><button class="btn main" id="location-ok" type="button" hidden>Confirmar ubicación</button><button class="btn main" id="go" type="submit">Registrarme y entrar</button><p class="err" id="err" role="alert"></p></form><button class="btn mini" id="toggle-mode" type="button" style="--c:#00e5ff">Ya tengo una cuenta · Iniciar sesión</button></main>
<script src="js/config.js?v=11"></script><script src="js/auth.js?v=11"></script><script src="js/store.js?v=11"></script><script src="js/geo.js?v=11"></script><script src="js/touch.js?v=11"></script><script src="js/register.js?v=11"></script></body></html>
