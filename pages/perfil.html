<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil · NOVA</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css?v=22"><link rel="stylesheet" href="../css/app.css?v=22">
<style>html{background:#050507;color:#fff}</style><script>addEventListener("load",function(){if(!getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()){document.querySelectorAll("link[href*=\"css/\"]").forEach(function(l){var n=document.createElement("link");n.rel="stylesheet";n.href=l.getAttribute("href").split("?")[0]+"?r="+Date.now();document.head.appendChild(n)})}})</script>
</head><body>
<main class="page">
<h2>Tu perfil</h2><p class="muted">Cambia tu usuario, tu ubicación y tu foto.</p>
<div class="panel rgb">
<button type="button" class="avatar rgb" id="avatar" style="--c:#00e676" aria-label="Cambiar foto de perfil"></button><input type="file" id="file" accept="image/*" hidden><div id="myrole" class="myrole"></div>
<label for="name"><b>Nombre de usuario</b></label><input class="in" id="name" maxlength="16" autocomplete="off">
<b>Ubicación</b><div id="picker"></div>
<button class="btn main" id="save" type="button">Guardar cambios</button><p id="msg" class="err"></p></div>
<h2 style="margin-top:34px">Tu infografía</h2>
<div class="stats" style="margin-top:16px">
<div class="stat rgb" style="--c:#ff1744"><b id="s-rank">–</b>tu número de registro</div>
<div class="stat rgb" style="--c:#00e676"><b id="s-total">–</b>usuarios en total</div>
<div class="stat rgb" style="--c:#2979ff"><b id="s-days">–</b>días en la comunidad</div>
<div class="stat rgb" style="--c:#d500f9"><b id="s-msgs">–</b>mensajes enviados</div></div>
<div class="panel rgb"><b>Perfil completo</b><div class="donut" id="donut"><span></span></div>
<b>Tu país en la comunidad</b><div class="bar"><i id="bar"></i></div><p class="hint" id="bar-t"></p></div>
<div class="row-end"><button class="btn danger" id="del" type="button">Eliminar mi cuenta</button><button class="btn mini" id="adminBtn" data-staff type="button" style="--c:#ffd600" aria-label="Panel de administración" title="Panel de roles" hidden>⚙</button></div>
</main>
<script src="../js/config.js?v=22"></script><script src="../js/auth.js?v=22"></script><script src="../js/store.js?v=22"></script><script src="../js/nav.js?v=22"></script><script src="../js/touch.js?v=22"></script><script src="../js/notify.js?v=22"></script>
<script src="../js/geo.js?v=22"></script><script src="../js/profile.js?v=22"></script><script src="../js/roles.js?v=22"></script><script src="../js/staff.js?v=22"></script>
</body></html>
